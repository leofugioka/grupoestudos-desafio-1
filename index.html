<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio 1 | HTML CSS</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <header>
    <h1>Challenge 1 - Design: Login Card</h1>
  </header>

  <!-- Card Component -->
  <main>

    <div class="card">
      <div class="close-button">
        <i class="fa-solid fa-xmark"></i>
      </div>

      <p class="card-title">Login to Continue</p>

      <form>
        <div>
          <label for="email">Email</label>
          <input type="text" name="email" id="email">
        </div>

        <div>
          <label for="password">Password</label>
          <input type="password" name="password" id="password">
        </div>

        <p>Forgot Password?</p>

        <button type="submit">Login</button>
      </form>

    </div>

  </main>

  <footer>
    <p>Original Design by <a href="https://www.uidesigndaily.com/posts/sketch-login-log-in-authentication-day-662"
        target="_blank">UI
        Design Daily</a></p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/js/all.min.js"
    integrity="sha512-6BTOlkauINO65nLhXhthZMtepgJSghyimIalb+crKRPhvhmsCdnIuGcVbR5/aQY2A+260iC1OPy1oCdB6pSSwQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>

</html>
